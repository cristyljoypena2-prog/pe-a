<!DOCTYPE html>
<html>
<head>
    <title>CSS Transform Activity</title>
    <style>
        /* Base styling for the container and heading */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 50px;
        }

        /* Common style for all four boxes */
        .box {
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease; /* Smooth transition animation */
        }

        /* 1. Rotate Box */
        .rotate-box {
            background-color: #3498db; /* Blue */
        }
        .rotate-box:hover {
            transform: rotate(45deg);
        }

        /* 2. Scale Box */
        .scale-box {
            background-color: #e74c3c; /* Red */
        }
        .scale-box:hover {
            transform: scale(1.5);
        }

        /* 3. Translate Box */
        .translate-box {
            background-color: #2ecc71; /* Green */
        }
        .translate-box:hover {
            transform: translateX(50px);
        }

        /* 4. Skew Box */
        .skew-box {
            background-color: #f1c40f; /* Yellow */
            color: #333; /* Darker text for readability */
        }
        .skew-box:hover {
            transform: skewX(20deg);
        }
    </style>
</head>
<body>

    <h1>CSS Transform Activity</h1>
    <p>Hover over each colored box to see the transformation effect.</p>

    <div class="container">
        <!-- 1. Rotate Box -->
        <div class="box rotate-box">Rotate</div>

        <!-- 2. Scale Box -->
        <div class="box scale-box">Scale</div>

        <!-- 3. Translate Box -->
        <div class="box translate-box">Translate</div>

        <!-- 4. Skew Box -->
        <div class="box skew-box">Skew</div>
    </div>

</body>
</html>
